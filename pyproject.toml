[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "fedwater"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro~=1.5.0",
]

[project.scripts]
fedwater = "fedwater.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "fedwater.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "fedwater"
project_name = "fedwater"
kedro_init_version = "1.5.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "338d1bba496d4f828d29ef6d096f3824"

[tool.pytest.ini_options]
markers = [
    "integration: micro-world through the real pipelines (needs torch/wntr/kedro)",
]
