# =========================================================================
# fedwater experiment studies — declarative worlds x runs.
#
# A WORLD is everything that determines the simulated physics (sim seed,
# coupling, anchor scale, horizon, consumption map, beta, drift block, oracle
# settings). Expensive; simulated once; cached by content hash of the
# effective configuration. A RUN is everything that determines learning +
# analysis on a fixed world (fl seed, stride, batch size, rounds, surrogate
# counts). Cheap; many runs reuse one cached world.
#
# Consumption maps are 5 two-char tokens in district order A..E:
#   income   {L, M, H}  = low / medium / high
#   land use {R, M, C, I} = residential / mixed / commercial / industrial
# 'M' is disambiguated by position. e.g. LR_LM_LC_LR_LR = all incomes low;
# land use residential / mixed / commercial / residential / residential.
#
# `beta` is the land-use LEVEL dial: 0.0 = shape-only (volume-neutral), 1.0 =
# full level effect. It is a world axis, so gridding it re-simulates.
#
# LAND-USE REFACTOR: every map and every drift target in this file was
# rewritten from the density axis, and every world hash therefore changes.
# `data/09_experiments/worlds/` must be re-simulated in full.
# =========================================================================
root: data/09_experiments

studies:

  # ------------------------------------------------------- D0 replication --
  # 2 worlds (baseline + isolated) x 2 fl profiles x 20 fl seeds = 80 FL runs
  # on 2 cached simulations. Full shipped horizon (24 months, 15 rounds)
  # because that is where the audited claims live. World blocks are written
  # out explicitly (they equal conf/base today) so the manifest papertrail is
  # self-contained even if base parameters later change.
  d0_replication:
    description: >
      2 worlds (baseline + isolated) x 2 fl profiles x 20 fl seeds at the
      shipped horizon.
    worlds:
      fixed:
        sim_seed: 42
        n_months: 24
        anchor_scale: 0.05
        beta: 0.35
        consumption_map: LR_LM_LC_LR_LR
        drift: {tgt_district: District_D, seed_node: "2",
                to_income: low, to_land_use: commercial}
        # Oracle trimmed to the cheap + representation tiers: D0 audits the
        # FL side; the full centralized battery is not the measurand here.
        oracle:
          tiers: [1, 4]
          n_surrogates: 20
          n_surrogates_expensive: 8
          minirocket: {window_h: 24, stride_h: 6, n_kernels: 1000, pca_dims: 8}
      grid:
        coupling: [{variant: baseline, close_fraction: 0.0},
                   {variant: isolated, close_fraction: 1.0}]
    runs:
      fixed: {rounds: 15}
      grid:
        fl_seed: {range: 20}
      zip:
        - {step_size: 2, batch_size: 128}   # shipped throughput profile
        - {step_size: 1, batch_size: 64}    # BEPE-faithful default profile
    pipelines: [fl, dependence_detection, drift_attribution]
    harvest: [validation, drift, ladder, c4, dependence]
    retain: [prototype_history, latent_trajectories,
             latent_trajectories_residualized]

  # ------------------------------------------------------------ beta sweep --
  # The study the whole refactor exists to run. Same world in every respect
  # except the level dial: if regime legibility is carried by SHAPE rather
  # than LEVEL, the FL-side results should be roughly flat in beta while the
  # hydraulic loading is not. beta=0 is the control — a drift that changes the
  # temporal signature and nothing else. One fl seed per world here; add seeds
  # before quoting any per-world number.
  beta_sweep:
    description: >
      5 betas (0 -> 1) on one map and one drift, exploratory scale. Separates
      shape-carried regime information from level-carried hydraulic risk.
    worlds:
      fixed:
        sim_seed: 42
        n_months: 12
        anchor_scale: 0.05
        consumption_map: LR_LM_LC_LR_LR
        drift: {tgt_district: District_D, seed_node: "2",
                to_income: low, to_land_use: commercial}
        oracle:
          tiers: [1, 4]
          n_surrogates: 20
          n_surrogates_expensive: 8
          minirocket: {window_h: 24, stride_h: 6, n_kernels: 1000, pca_dims: 8}
      grid:
        beta: [0.0, 0.25, 0.5, 0.75, 1.0]
    runs:
      fixed: {rounds: 8, step_size: 3, batch_size: 128,
              n_surrogates: 40, n_surrogates_expensive: 15}
      grid:
        fl_seed: [0, 1, 2]
    pipelines: [fl, dependence_detection, drift_attribution]
    harvest: [validation, drift, ladder, c4, dependence]
    retain: [prototype_history]

  # -------------------------------------------------- drift-origin sweep --
  # Which client drifts? One world per target district (seed node auto-picked:
  # the district's largest-base-demand junction, skipping zero-demand trunk
  # nodes), >= 3 fl seeds each — the D0 lesson applied: no per-world point
  # estimates without a seed spread. Exploratory scale (12 months / 8 rounds /
  # stride 3, the label-factory operating point).
  #
  # Per-district sensitivity is a real effect worth watching here: on the
  # stress ablation the same drift at the same beta differed 4x across
  # districts, with B the stable weak link and E state-dependent. Distance
  # from the source did NOT explain the ranking.
  drift_origin_sweep:
    description: >
      5 worlds (drift origin A..E, auto seed node) x 3 fl seeds at
      exploratory scale.
    worlds:
      fixed:
        sim_seed: 42
        n_months: 12
        anchor_scale: 0.05
        beta: 0.35
        consumption_map: LR_LM_LR_LR_LM
        oracle:
          tiers: [1, 4]
          n_surrogates: 20
          n_surrogates_expensive: 8
          minirocket: {window_h: 24, stride_h: 6, n_kernels: 1000, pca_dims: 8}
      grid:
        drift: [{tgt_district: District_A, to_income: low, to_land_use: commercial},
                {tgt_district: District_B, to_income: low, to_land_use: commercial},
                {tgt_district: District_C, to_income: low, to_land_use: commercial},
                {tgt_district: District_D, to_income: low, to_land_use: commercial},
                {tgt_district: District_E, to_income: low, to_land_use: commercial}]
    runs:
      fixed: {rounds: 8, step_size: 3, batch_size: 128,
              n_surrogates: 40, n_surrogates_expensive: 15}
      grid:
        fl_seed: [0, 1, 2]
    pipelines: [fl, dependence_detection, drift_attribution]
    harvest: [validation, drift, ladder, c4, dependence]
    retain: [prototype_history]

  # ----------------------------------------------- consumption-map sweep --
  # How does the income/land-use portfolio change the story? Map 1 is the
  # shipped scenario; map 2 is a pure income gradient with land use held at
  # residential (the pre-refactor question, asked cleanly); map 3 is
  # deliberately demand-heavy to exercise the feasibility policy — if it fails
  # V-checks at anchor 0.05 that is a *recorded outcome* (policy a), or
  # uncomment the auto-anchor ladder in engine.ensure_world (policy b).
  # District_D is (low, residential) in all three maps so the fixed drift is
  # never a no-op.
  consumption_map_sweep:
    description: >
      3 consumption maps x 3 fl seeds at exploratory scale; drift fixed on
      District_D (residential -> commercial in every map).
    worlds:
      fixed:
        sim_seed: 42
        n_months: 12
        anchor_scale: 0.05
        beta: 0.35
        drift: {tgt_district: District_D, seed_node: "2",
                to_income: low, to_land_use: commercial}
        oracle:
          tiers: [1, 4]
          n_surrogates: 20
          n_surrogates_expensive: 8
          minirocket: {window_h: 24, stride_h: 6, n_kernels: 1000, pca_dims: 8}
      grid:
        consumption_map: [LR_LM_LC_LR_LR,      # shipped scenario
                          LR_MR_HR_LR_LR,      # income gradient, land use held
                          MC_HM_HC_LR_LM]      # demand-heavy stress case
    runs:
      fixed: {rounds: 8, step_size: 3, batch_size: 128,
              n_surrogates: 40, n_surrogates_expensive: 15}
      grid:
        fl_seed: [0, 1, 2]
    pipelines: [fl, dependence_detection, drift_attribution]
    harvest: [validation, drift, ladder, c4, dependence]
    retain: [prototype_history]

  # --------------------------------------------------- drift-origin prospect --
  drift_origin_prospect:
    description: >
      5 worlds (drift origin A..E, auto seed node) — worlds only for now;
      single fl_seed kept in the run spec for when you run it.
    worlds:
      fixed:
        sim_seed: 42
        n_months: 12
        anchor_scale: 0.05
        beta: 0.35
        consumption_map: LM_LR_LR_LR_LM
        oracle:
          tiers: [1, 4]
          n_surrogates: 20
          n_surrogates_expensive: 8
          minirocket: {window_h: 24, stride_h: 6, n_kernels: 1000, pca_dims: 8}
      grid:
        drift: [{tgt_district: District_A, to_income: low, to_land_use: commercial},
                {tgt_district: District_B, to_income: low, to_land_use: commercial},
                {tgt_district: District_C, to_income: low, to_land_use: mixed},
                {tgt_district: District_D, to_income: low, to_land_use: commercial},
                {tgt_district: District_E, to_income: low, to_land_use: commercial}]
    runs:
      fixed: {rounds: 8, step_size: 3, batch_size: 128,
              n_surrogates: 40, n_surrogates_expensive: 15, fl_seed: 0}
    pipelines: [fl, dependence_detection, drift_attribution]
    harvest: [validation, drift, ladder, c4, dependence]
    retain: [prototype_history]

  # A longer horizon lets the diffusion front finish converting the district:
  # the front advances one BFS ring per month, so max_neighbors_per_month
  # limits its width, not its depth. warmup_months 4 pushes the onset clear of
  # the FL scaler's commissioning window.
  drift_origin_landuse:
    description: >
      10 worlds (drift origin A..E, auto seed node) at a 30-month horizon —
      worlds only for now; single fl_seed kept in the run spec.
    worlds:
      fixed:
        sim_seed: 42
        n_months: 30
        anchor_scale: 0.05
        beta: 0.35
        consumption_map: LC_MR_LR_LR_LI
        oracle:
          tiers: [1, 4]
          n_surrogates: 20
          n_surrogates_expensive: 8
          minirocket: {window_h: 24, stride_h: 6, n_kernels: 1000, pca_dims: 8}
      grid:
        drift: [{tgt_district: District_A, to_income: low, to_land_use: industrial, warmup_months: 4},
                {tgt_district: District_B, to_income: low, to_land_use: commercial, warmup_months: 4},
                {tgt_district: District_C, to_income: low, to_land_use: commercial, warmup_months: 4},
                {tgt_district: District_D, to_income: low, to_land_use: commercial, warmup_months: 4},
                {tgt_district: District_E, to_income: low, to_land_use: residential, warmup_months: 4},

                {tgt_district: District_A, to_income: medium, to_land_use: commercial, warmup_months: 4},
                {tgt_district: District_B, to_income: high, to_land_use: residential, warmup_months: 4},
                {tgt_district: District_C, to_income: medium, to_land_use: residential, warmup_months: 4},
                {tgt_district: District_D, to_income: medium, to_land_use: residential, warmup_months: 4},
                {tgt_district: District_E, to_income: medium, to_land_use: industrial, warmup_months: 4}
                
                ]
    runs:
      fixed: {rounds: 8, step_size: 3, batch_size: 128,
              n_surrogates: 40, n_surrogates_expensive: 15, fl_seed: 0}
    pipelines: [fl, dependence_detection, drift_attribution]
    harvest: [validation, drift, ladder, c4, dependence]
    retain: [prototype_history]



  drift_origin_landuse_expanded:
    description: >
      10 worlds (drift origin A..E, auto seed node) at a 30-month horizon —
      worlds only for now; single fl_seed kept in the run spec.
    worlds:
      fixed:
        sim_seed: 42
        n_months: 30
        anchor_scale: 0.05
        beta: 0.35
        consumption_map: LR_LC_LI_LR_LR
        oracle:
          tiers: [1, 4]
          n_surrogates: 20
          n_surrogates_expensive: 8
          minirocket: {window_h: 24, stride_h: 6, n_kernels: 1000, pca_dims: 8}
      grid:
        drift: [{tgt_district: District_A, to_income: low, to_land_use: industrial, warmup_months: 4},
                {tgt_district: District_A, to_income: low, to_land_use: commercial, warmup_months: 4},

                {tgt_district: District_B, to_income: low, to_land_use: residential, warmup_months: 4},
                {tgt_district: District_B, to_income: low, to_land_use: industrial, warmup_months: 4},

                {tgt_district: District_C, to_income: low, to_land_use: residential, warmup_months: 4},
                {tgt_district: District_C, to_income: low, to_land_use: commercial, warmup_months: 4},

                {tgt_district: District_D, to_income: low, to_land_use: industrial, warmup_months: 4},
                {tgt_district: District_D, to_income: low, to_land_use: commercial, warmup_months: 4},
                
                {tgt_district: District_E, to_income: low, to_land_use: industrial, warmup_months: 4},
                {tgt_district: District_E, to_income: low, to_land_use: commercial, warmup_months: 4}
                ]
    runs:
      fixed: {rounds: 8, step_size: 3, batch_size: 128,
              n_surrogates: 40, n_surrogates_expensive: 15, fl_seed: 0}
    pipelines: [fl, dependence_detection, drift_attribution]
    harvest: [validation, drift, ladder, c4, dependence]
    retain: [prototype_history]


  drift_origin_landuse_expanded_V4:
    description: >
      10 worlds (drift origin A..E, auto seed node) at a 30-month horizon —
      worlds only for now; single fl_seed kept in the run spec.
    worlds:
      fixed:
        sim_seed: 42
        n_months: 30
        anchor_scale: 0.05
        beta: 0.35
        consumption_map: LR_LI_LI_LC_LR
        oracle:
          tiers: [1, 4]
          n_surrogates: 20 
          n_surrogates_expensive: 8
          minirocket: {window_h: 24, stride_h: 6, n_kernels: 1000, pca_dims: 8}
      grid:
        drift: [{tgt_district: District_A, to_income: low, to_land_use: industrial, warmup_months: 4},
                {tgt_district: District_A, to_income: low, to_land_use: commercial, warmup_months: 4},

                {tgt_district: District_B, to_income: low, to_land_use: residential, warmup_months: 4},
                {tgt_district: District_B, to_income: low, to_land_use: commercial, warmup_months: 4},

                {tgt_district: District_C, to_income: low, to_land_use: residential, warmup_months: 4},
                {tgt_district: District_C, to_income: low, to_land_use: commercial, warmup_months: 4},

                {tgt_district: District_D, to_income: low, to_land_use: industrial, warmup_months: 4},
                {tgt_district: District_D, to_income: low, to_land_use: residential, warmup_months: 4},
                
                {tgt_district: District_E, to_income: low, to_land_use: industrial, warmup_months: 4},
                {tgt_district: District_E, to_income: low, to_land_use: commercial, warmup_months: 4}
                ]
    runs:
      fixed: {rounds: 8, step_size: 3, batch_size: 128,
              n_surrogates: 40, n_surrogates_expensive: 15, fl_seed: 0}
    pipelines: [fl]
    harvest: [validation, drift]
    retain: [prototype_history]    


  resolution_probe:
    worlds:
      fixed:
        n_months: 6                    # 4x the steps per month, so shorten
        consumption_map: LR_LC_LC_LI_LR
      grid:
        sim_overrides:
          - time: {resolution_h: 1}       # baseline, for comparison
          - time: {resolution_h: 0.25}    # 15 min -> 96 steps/day
          - time: {resolution_h: 0.125}   # 7.5 min -> 192 steps/day
    runs:
      fixed: {rounds: 1}