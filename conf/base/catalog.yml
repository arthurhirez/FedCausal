# --- demand_synthesis / hydraulics ----------------------------------------
demand_series:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/demand_series.parquet

pressures:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/pressures.parquet

