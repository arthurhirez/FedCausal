# =========================================================================
# fedwater data catalog. Naming: gt_* entries are ground truth — they exist
# to evaluate methods, never to train them.
# =========================================================================

# --- the selected network -------------------------------------------------
# ${globals:network} comes from conf/base/globals.yml and is overridable for a
# single run via conf/local/globals.yml (which is what the experiments engine
# writes). A bundle is a directory under data/01_raw/ holding three
# hand-authored files (network.inp, profile.yml, districts.yml) and the
# generated `partitions/` store.

network_inp:
  type: fedwater.datasets.WntrNetworkDataset
  filepath: data/01_raw/${globals:network}/network.inp

network_inp_text:          # the same file as text: its content hash is part
  type: text.TextDataset   # of every partition's and probe stack's identity
  filepath: data/01_raw/${globals:network}/network.inp

network_profile:
  type: kedro_datasets.yaml.YAMLDataset
  filepath: data/01_raw/${globals:network}/profile.yml

# The hand-authored partition. Read ONLY by the districting pipeline, which
# adopts it verbatim as partitions/manual/.
districts_manual:
  type: kedro_datasets.yaml.YAMLDataset
  filepath: data/01_raw/${globals:network}/districts.yml

districts_manual_text:
  type: text.TextDataset
  filepath: data/01_raw/${globals:network}/districts.yml

# --- the active partition -------------------------------------------------
# What every world is built on: globals.districting.active names a directory
# under partitions/, written once per network by `kedro run --pipeline
# districting`. A missing directory fails the run with a load error on
# `districts` -- build the partition first.
districts:
  type: kedro_datasets.yaml.YAMLDataset
  filepath: data/01_raw/${globals:network}/partitions/${globals:districting.active}/districts.yml

partition_manifest:
  type: kedro_datasets.yaml.YAMLDataset
  filepath: data/01_raw/${globals:network}/partitions/${globals:districting.active}/partition.yml

# --- districting (once per network; not part of __default__) --------------
# Writes <method>/districts.yml and <method>/partition.yml for every method in
# globals.districting.methods. overwrite stays false: building one method
# never deletes another's partition.
partition_files:
  type: partitions.PartitionedDataset
  path: data/01_raw/${globals:network}/partitions
  dataset:
    type: text.TextDataset
  filename_suffix: ".yml"

partition_tables:
  type: partitions.PartitionedDataset
  path: data/01_raw/${globals:network}/partitions
  dataset:
    type: pandas.CSVDataset
    save_args: {index: false}
  filename_suffix: ".csv"

districting_summary:
  type: pandas.CSVDataset
  filepath: data/08_reporting/districting/${globals:network}/summary.csv

districting_sanity:
  type: pandas.CSVDataset
  filepath: data/08_reporting/districting/${globals:network}/sanity.csv

districting_order_sensitivity:
  type: pandas.CSVDataset
  filepath: data/08_reporting/districting/${globals:network}/order_sensitivity.csv

# --- assessment (pre-flight; not part of __default__) ---------------------
# Namespaced by network so two networks' reports never overwrite each other.

network_inventory:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/inventory.csv

assessment_partition:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/partition.csv

assessment_crossing_links:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/crossing_links.csv

conditioning_tier:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/conditioning_tier.csv

conditioning_attempts:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/conditioning_attempts.csv

conditioning_recipe:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/conditioning_recipe.csv

capacity_summary:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/capacity_summary.csv

capacity_curve:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/capacity_curve.csv

capacity_defects:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/capacity_defects.csv

capacity_binding:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/capacity_binding.csv

assessment_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/assessment/${globals:network}/REPORT.csv

# --- network_prep ---------------------------------------------------------
# Provenance for the network-scoped parameters: which of them came from
# conf/ and which from the bundle's profile.yml. Written on every run so a
# world's artifacts record the operating point they were actually built at.
network_params_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/network_params_report.csv

# What configure_network found in the .inp and what it pinned: declared unit
# system, headloss formula, the file's own demand multiplier, the component
# census (tanks/pumps/valves/controls), and any pattern lengths it normalised.
network_prep_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/network_prep_report.csv

wn_variant:
  type: pickle.PickleDataset
  filepath: data/02_intermediate/wn_variant.pkl

partition_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/partition_report.csv

gt_boundaries:
  type: pandas.CSVDataset
  filepath: data/03_primary/gt_boundaries.csv
  load_args:
    dtype: {pipe: str}

# --- urban_scenario -------------------------------------------------------
income_factors:
  type: pandas.CSVDataset
  filepath: data/03_primary/income_factors.csv

landuse_factors:
  type: pandas.CSVDataset
  filepath: data/03_primary/landuse_factors.csv

portfolios_t0:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/portfolios_t0.parquet
  
gt_drift_schedule:
