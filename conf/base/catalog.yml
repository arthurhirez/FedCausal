  filepath: data/02_intermediate/flows.parquet

demands_simulated:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/demands_simulated.parquet

# --- sensor placement: which gauges each client reads ---------------------
# THE downstream contract for sensors: one row per slot, with the element,
# how the slot was filled, and the district mixture (w_<District>) measured at
# this world's coupling. The probe stacks it was chosen from live in the
# shared store (globals.probe_store); stacks.yml points at them.
sensor_placement:
  type: pandas.CSVDataset
  filepath: data/03_primary/sensor_placement.csv
  load_args: {dtype: {element: str}}
  save_args: {index: false}

placement_stacks:
  type: kedro_datasets.yaml.YAMLDataset
  filepath: data/08_reporting/sensor_placement/stacks.yml

placement_coverage:
  type: pandas.CSVDataset
  filepath: data/08_reporting/sensor_placement/coverage.csv
  save_args: {index: false}

placement_channels:
  type: pandas.CSVDataset
  filepath: data/08_reporting/sensor_placement/channels.csv
  save_args: {index: false}

placement_report_arms:      # control_low / unusable -- report only
  type: pandas.CSVDataset
  filepath: data/08_reporting/sensor_placement/report_arms.csv
  save_args: {index: false}

placement_verification:
  type: pandas.CSVDataset
  filepath: data/08_reporting/sensor_placement/verification.csv
  save_args: {index: false}

# --- sensing: what federated clients observe ------------------------------
sensor_series:
  type: pandas.ParquetDataset
  filepath: data/03_primary/sensor_series.parquet

client_datasets:
  type: partitions.PartitionedDataset
  path: data/07_model_output/clients
  dataset:
    type: pandas.CSVDataset
    save_args: {index: false}
  filename_suffix: ".csv"
  # A PartitionedDataset ADDS partitions by default, it does not replace the
  # directory. District names are per-network, so switching networks left the
  # previous one's clients behind: a KY7 run (districts A-D) inherited Graeme's
  # District_E.csv, and any FL stage reading this folder would have trained a
  # fifth client on a district the world does not contain.
  overwrite: true

